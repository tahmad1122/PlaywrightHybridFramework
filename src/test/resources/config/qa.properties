# =====================================================
# Application Configuration
# =====================================================
baseUrl=https://eventhub.rahulshettyacademy.com/login
#baseUrl=https://automationexercise.com/login

# =====================================================
# Login Credentials
# =====================================================
# Valid
login.email=test@gmail.com
login.password=Test@123

# Invalid
login.invalid.email=test@g.com
login.invalid.password=123

# =====================================================
# Booking
# =====================================================
# Number of tickets for the event
booking.tickets=2

# Attendee details entered in the booking form
attendee.name=jhon
attendee.email=jhon@gmail.com
attendee.phone=8877887788

# =====================================================
# Groq AI Configuration
# =====================================================
# groq.apiKey is left blank on purpose - set it via the GROQ_API_KEY
# environment variable instead (GroqClient checks the env var first).
# Never commit a real key to this file.
groq.apiKey=
groq.model=openai/gpt-oss-20b
groq.baseUrl=https://api.groq.com/openai/v1/chat/completions
groq.enabled=true